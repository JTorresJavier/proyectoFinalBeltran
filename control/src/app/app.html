<!-- ── ROUTER OUTLET ───────────────────────────
     Contenedor principal de StoreHub.
     Angular inserta aquí el componente según la URL activa.
     [@routeAnimations]: dispara la transición al cambiar de página,
     usando la URL como dato que identifica cada estado.           -->

<div [@routeAnimations]="outlet.isActivated ? outlet.activatedRouteData['animation'] ?? outlet.activatedRoute : ''">
  <router-outlet #outlet="outlet"></router-outlet>
</div>
