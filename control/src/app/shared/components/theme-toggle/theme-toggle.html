<button
  class="theme-toggle"
  type="button"
  role="switch"
  [attr.aria-checked]="theme.isDark()"
  [attr.aria-label]="theme.isDark() ? 'Cambiar al tema claro' : 'Cambiar al tema oscuro'"
  [title]="theme.isDark() ? 'Cambiar al tema claro' : 'Cambiar al tema oscuro'"
  (click)="theme.toggle()">
  <span class="theme-toggle-label">{{ theme.isDark() ? 'Oscuro' : 'Claro' }}</span>
  <span class="theme-switch-track" [class.theme-switch-active]="theme.isDark()">
    <span class="theme-switch-thumb">
      <mat-icon>{{ theme.isDark() ? 'dark_mode' : 'light_mode' }}</mat-icon>
    </span>
  </span>
</button>
